<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | BlogSpace</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">BlogSpace<span>.</span></a><nav><a href="index.html">Home</a><a href="login.html">Login</a><a class="active" href="register.html">Register</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Create a demo profile to try the interface.</p><form id="register-form"><label for="register-name">Full name</label><input id="register-name" type="text" placeholder="Your name" required><label for="register-email">Email</label><input id="register-email" type="email" placeholder="you@example.com" required><label for="register-password">Password</label><input id="register-password" type="password" minlength="6" placeholder="At least 6 characters" required><button class="button full" type="submit">Create account</button><p id="register-message" class="form-message" aria-live="polite"></p></form><p class="muted">Already registered? <a href="login.html">Log in</a></p></section></main><footer>© 2026 BlogSpace</footer><script src="app.js"></script></body></html>
