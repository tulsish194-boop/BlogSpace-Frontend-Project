<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Blog | BlogSpace</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">BlogSpace<span>.</span></a><nav><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="auth-wrap create-wrap"><section class="auth-card wide"><p class="eyebrow">SHARE AN IDEA</p><h1>Create a blog post</h1><p class="muted">Your post is saved in this browser using local storage.</p><form id="blog-form"><label for="blog-title">Post title</label><input id="blog-title" type="text" maxlength="100" placeholder="Give your story a title" required><label for="blog-category">Category</label><select id="blog-category"><option>Technology</option><option>Learning</option><option>Lifestyle</option><option>Career</option><option>Other</option></select><label for="blog-excerpt">Short summary</label><input id="blog-excerpt" type="text" maxlength="180" placeholder="What is your story about?" required><label for="blog-content">Blog content</label><textarea id="blog-content" rows="8" placeholder="Start writing here..." required></textarea><button class="button full" type="submit">Publish post</button><p id="blog-message" class="form-message" aria-live="polite"></p></form><p><a href="dashboard.html">← Back to dashboard</a></p></section></main><footer>© 2026 BlogSpace</footer><script src="app.js"></script></body></html>
